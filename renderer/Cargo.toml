[package]
name = "renderer"
edition = "2024"
version.workspace = true

[dependencies]
wgpu.workspace = true
log.workspace = true
nalgebra.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
gpu-utils = { workspace = true }
fxhash.workspace = true
utils = { workspace = true }
smallvec = { workspace = true }
parking_lot.workspace = true

# moka spawns background threads and is unsupported on wasm; the pipeline
# cache falls back to a locked map there (see src/pipeline_cache.rs).
# NOTE: the `cfg` expression below must stay in sync with the `web` alias
# defined in build.rs (`all(target_arch = "wasm32", target_os = "unknown")`).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
moka.workspace = true

[features]
# Carry the per-frame parameter block in a uniform buffer instead of immediates.
# Implied by a wasm build (WebGPU has no push constants); exposed as a feature so
# the exact same code path — shader rewrite, bind group index, buffer size,
# uniform layout rules — can be exercised on a real desktop GPU, without a
# browser. See `core_renderer/frame_params.rs` and `tests/uniform_params.rs`.
uniform-params = []

[dev-dependencies]
futures = { workspace = true }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true
