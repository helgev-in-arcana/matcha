[package]
name = "matcha-ecs-widgets"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
# self
matcha-ecs = { workspace = true }
# Two vocabularies, both of which matcha-ecs *defines components in terms of*
# but does not re-export: `CursorIcon` (Button/Checkbox/Link/Slider/TextBox all
# declare one) and the key/IME event types a `KeyDispatch`/`ImeDispatch`
# handler receives (Slider's arrow keys, TextBox's editing). A widget cannot
# implement those core components without naming these types, so the direct
# dependency stands until the core re-exports them — deferred deliberately,
# along with the rest of the crate's public module tree.
#
# Not a backend dependency: since d787f2f the key types are the W3C UI Events
# vocabulary (`keyboard-types`), so nothing here is tied to winit or baseview.
matcha-window = { workspace = true }

# ecs
bevy_ecs = "0.18.1"

# graphics (for widgets that build render nodes directly)
renderer = { workspace = true }
gpu-utils = { workspace = true }
wgpu = { workspace = true }
nalgebra = { features = ["bytemuck"], workspace = true }

# text shaping/rasterization (M6)
suzuri = { path = "../../Suzuri" }

# text shaping/rasterization, parley-based (RichText)
parley = { workspace = true }
swash = { workspace = true }
glyph-cache = { workspace = true }

# raster image decode (Image)
image = { workspace = true }

# other
log = { workspace = true }
web-time = { workspace = true }
fxhash = { workspace = true }
parking_lot = { workspace = true }

# NOTE: the `cfg` expression below must stay in sync with the `web` alias
# defined in build.rs (`all(target_arch = "wasm32", target_os = "unknown")`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# This crate also holds wgpu handles in ECS resources (FontCtx's stencil cache,
# ImageCtx). matcha-ecs enables the same feature and Cargo unifies them, but
# declaring it here too keeps the requirement honest at the crate that has it.
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true
