[package]
name = "matcha-ecs-widgets"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
# self
matcha-ecs = { workspace = true }
# Cursor, key and IME types used by the core's input components and dispatch
# callbacks. Key types use the backend-independent W3C UI Events vocabulary.
matcha-window = { workspace = true }

# ecs
bevy_ecs = "0.18.1"

# Resource definitions and GPU generators; placement belongs to the renderer.
render-interface.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
nalgebra = { features = ["bytemuck"], workspace = true }

# text layout/rasterization (Text)
suzuri = { path = "../../Suzuri" }

# text shaping/rasterization, parley-based (RichText)
parley = { workspace = true }
swash = { workspace = true }
glyph-cache = { workspace = true }

# raster image decode (Image)
image = { workspace = true }

# other
log = { workspace = true }
web-time = { workspace = true }
fxhash = { workspace = true }
parking_lot = { workspace = true }

[lints]
workspace = true
