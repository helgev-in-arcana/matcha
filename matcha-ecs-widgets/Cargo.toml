[package]
name = "matcha-ecs-widgets"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
# self
matcha-ecs = { workspace = true }
# Cursor, key and IME types used by the core's input components and dispatch
# callbacks. Key types use the backend-independent W3C UI Events vocabulary.
matcha-window = { workspace = true }

# ecs
bevy_ecs = "0.18.1"

# Resource definitions and GPU generators; placement belongs to the renderer.
render-interface.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
nalgebra = { features = ["bytemuck"], workspace = true }

# text layout/rasterization (Text)
suzuri = { path = "../../Suzuri" }

# text shaping/rasterization, parley-based (RichText)
parley = { workspace = true }
swash = { workspace = true }
glyph-cache = { workspace = true }

# raster image decode (Image)
image = { workspace = true }

# other
log = { workspace = true }
web-time = { workspace = true }
fxhash = { workspace = true }
parking_lot = { workspace = true }

# NOTE: the `cfg` expression below must stay in sync with the `web` alias
# defined in build.rs (`all(target_arch = "wasm32", target_os = "unknown")`).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# The workspace dep turns `image`'s defaults off for wasm's sake; `rayon` is
# only unusable *there*, so a native build gets its parallel decode back.
image = { workspace = true, features = ["rayon"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# This crate also holds wgpu handles in ECS resources (FontCtx's stencil cache,
# ImageCtx). matcha-ecs enables the same feature and Cargo unifies them, but
# declaring it here too keeps the requirement honest at the crate that has it.
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[lints]
workspace = true
