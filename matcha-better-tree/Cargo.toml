[package]
name = "matcha-better-tree"
edition = "2024"
version.workspace = true

[dependencies]
# self
render-interface = { workspace = true }
# Select the backend through this crate's features, independently of workspace defaults.
matcha-window = { path = "../matcha-window", default-features = false }

# graphics
wgpu = { workspace = true }

# math
nalgebra = { features = ["bytemuck"], workspace = true }

# other
bitflags = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
gpu-utils = { workspace = true }
plain-renderer = { workspace = true }
matcha-window = { path = "../matcha-window", default-features = false, features = ["headless"] }
futures = { workspace = true }
bytemuck = { workspace = true }

[features]
default = ["winit"]
winit = ["matcha-window/winit"]
baseview = ["matcha-window/baseview"]

[lints]
workspace = true
