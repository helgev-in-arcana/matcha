[package]
name = "matcha-better-tree"
edition = "2024"
version.workspace = true

[dependencies]
# self
render-interface = { workspace = true }
utils = { workspace = true }
# Select the backend through this crate's features, independently of workspace defaults.
matcha-window = { path = "../matcha-window", default-features = false }

# graphics
gpu-utils = { workspace = true }
plain-renderer = { workspace = true }
wgpu = { workspace = true }

# math
nalgebra = { features = ["bytemuck"], workspace = true }

# other
async-channel = { workspace = true }
bitflags = { workspace = true }
log = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
matcha-window = { path = "../matcha-window", default-features = false, features = ["headless"] }
render-interface = { workspace = true, features = ["scene-builder"] }
futures = { workspace = true }
bytemuck = { workspace = true }

[[example]]
name = "poll_animation"
required-features = ["winit"]

[features]
default = ["winit"]
winit = ["matcha-window/winit"]
baseview = ["matcha-window/baseview"]

[lints]
workspace = true
