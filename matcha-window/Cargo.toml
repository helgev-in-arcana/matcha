[package]
name = "matcha-window"
edition = "2024"
version.workspace = true

[dependencies]
# self
utils = { workspace = true }
gpu-utils = { workspace = true }
shared-buffer = { workspace = true }

wgpu = { workspace = true }

# async runtime, utility
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# winit
winit = { workspace = true, optional = true }
baseview = { workspace = true, optional = true }

# math
nalgebra = { features = ["bytemuck"], workspace = true }

# other
bitflags = { workspace = true }
num = { workspace = true }
fxhash = { workspace = true }
dashmap = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
enum-map = "2.7.3"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }

[features]
default = ["winit"]
winit = ["dep:winit"]
baseview = ["dep:baseview"]

[lints]
workspace = true
