[workspace]
members = [
    "matcha",
    "matcha-tree",
    "matcha-tree-widgets",
    "renderer",
    "utils",
    "gpu-utils",
    "shared-buffer",
    "matcha-window",
    "matcha-ecs",
    "matcha-ecs-widgets",
    "glyph-cache",
    "matcha-web",
]
resolver = "3"

[workspace.package]
version = "0.0.6"

[workspace.dependencies]
# self
matcha = { path = "matcha" }
matcha-tree = { path = "matcha-tree" }
matcha-window = { path = "matcha-window" }
matcha-tree-widgets = { path = "matcha-tree-widgets" }
matcha-ecs = { path = "matcha-ecs" }
matcha-ecs-widgets = { path = "matcha-ecs-widgets" }
matcha-web = { path = "matcha-web" }
shared-buffer = { path = "shared-buffer" }
renderer = { path = "renderer" }
utils = { path = "utils" }
gpu-utils = { path = "gpu-utils" }
glyph-cache = { path = "glyph-cache" }

# async runtime, utilities
# `rt-multi-thread` is intentionally omitted: it is not supported on wasm.
# Crates that need it add it via a target-specific or dev dependency.
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "parking_lot",
    "time",
] }
async-trait = "0.1.88"
futures = "0.3.31"
parking_lot = { version = "0.12.3" }

# window
winit = "0.30"
# The W3C UI Events keyboard vocabulary. Not a windowing library: enums only,
# bitflags its sole dependency. Both backends already speak it.
keyboard-types = "0.8"
baseview = { git = "https://github.com/RustAudio/baseview.git" }

# accessibility
accesskit = "0.21"
accesskit_winit = { version = "0.29", features = ["tokio"] }

# graphics
wgpu = { version = "29", features = ["noop"] }
bytemuck = { version = "1", features = ["derive"] }

# math
nalgebra = { version = "0.34", features = ["bytemuck"] }

# image
# `default = ["rayon", "default-formats"]`, and neither is usable on wasm:
# `rayon` is an OS thread pool, and `default-formats` includes `avif` ->
# ravif/rav1e. Everything else in `default-formats` is pure Rust and kept, so
# this narrows only those two rather than the format list generally.
#
# `rayon` is added back for native targets by the crates that consume this
# (matcha-ecs-widgets, matcha-tree-widgets) — a wasm constraint should not cost
# a desktop build its parallel decode.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "dds",
    "ff",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }

# font
# Disabled: crates.io suzuri 0.2.1 pins wgpu ^27, blocking the workspace's wgpu 29
# upgrade. Only the legacy matcha-tree stack used this (with the `wgpu` feature);
# matcha-ecs-widgets uses the sibling path dependency (CPU shaping only, no wgpu).
# suzuri = { version = "0.2.1", features = ["wgpu"] }
parley = { version = "0.11.0", features = ["complex-scripts"] }
swash = "0.2.6"

# other
rand = "0.9"
bitflags = "2.6"
num = "0.4"
fxhash = "0.2"
dashmap = "6.1"
smallvec = "1.14"

# cache
# lru = "0.14.0"
moka = { version = "0.12", features = ["sync"] }

# error handling
thiserror = "2.0"

# log
log = "^0.4.28"

# wasm
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"

# build-time cfg aliases.
# Each crate that splits modules along the "web" axis declares a `web` alias
# in its build.rs via `cfg_aliases::cfg_aliases!`. The alias expansion is
# kept in sync with the `[target.'cfg(...)']` sections in each Cargo.toml.
cfg_aliases = "0.2"

# interpolation crate
# todo: maybe useful.
# interpolation = "0.3.0"


[workspace.lints.clippy]
unwrap_used = "warn"
type_complexity = "allow"
