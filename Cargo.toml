[workspace]
members = [
    "matcha",
    "matcha-tree",
    "matcha-tree-widgets",
    "renderer",
    "text-render",
    "utils",
    "gpu-utils",
    "shared-buffer",
    "matcha-window",
    "matcha-ecs",
]
resolver = "3"

[workspace.package]
version = "0.0.5"

[workspace.dependencies]
# self
matcha = { path = "matcha" }
matcha-tree = { path = "matcha-tree" }
matcha-window = { path = "matcha-window" }
matcha-tree-widgets = { path = "matcha-tree-widgets" }
shared-buffer = { path = "shared-buffer" }
renderer = { path = "renderer" }
text-render = { path = "text-render" }
utils = { path = "utils" }
gpu-utils = { path = "gpu-utils" }

# async runtime, utilities
# `rt-multi-thread` is intentionally omitted: it is not supported on wasm.
# Crates that need it add it via a target-specific or dev dependency.
tokio = { version = "1", features = [
    "rt",
    "macros",
    "sync",
    "parking_lot",
    "time",
] }
async-trait = "0.1.88"
futures = "0.3.31"
parking_lot = { version = "0.12.3" }

# window
winit = "0.30"
baseview = { git = "https://github.com/RustAudio/baseview.git" }

# accessibility
accesskit = "0.21"
accesskit_winit = { version = "0.29", features = ["tokio"] }

# graphics
wgpu = { version = "27.0.1", features = ["noop"] }
bytemuck = { version = "1", features = ["derive"] }
vello = { git = "https://github.com/linebender/vello.git", branch = "main" }

# math
nalgebra = { version = "0.34", features = ["bytemuck"] }

# image
image = "0.25"

# font
suzuri = { version = "0.2.1", features = ["wgpu"] }

# other
rand = "0.9"
bitflags = "2.6"
num = "0.4"
fxhash = "0.2"
dashmap = "6.1"
smallvec = "1.14"

# cache
# lru = "0.14.0"
moka = { version = "0.12", features = ["sync"] }

# error handling
thiserror = "2.0"

# log
log = "^0.4.28"

# wasm
web-time = "1.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"

# build-time cfg aliases.
# Each crate that splits modules along the "web" axis declares a `web` alias
# in its build.rs via `cfg_aliases::cfg_aliases!`. The alias expansion is
# kept in sync with the `[target.'cfg(...)']` sections in each Cargo.toml.
cfg_aliases = "0.2"

# interpolation crate
# todo: maybe useful.
# interpolation = "0.3.0"


[workspace.lints.clippy]
unwrap_used = "warn"
type_complexity = "allow"
