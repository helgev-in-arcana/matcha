[package]
name = "matcha-ecs"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
# self
renderer = { workspace = true }
gpu-utils = { workspace = true }
matcha-window = { workspace = true }

# ecs
bevy_ecs = "0.18.1"
bevy_tasks = "0.18.1"

# async runtime, utility
futures = { workspace = true }
parking_lot = { workspace = true }

# graphics
wgpu = { workspace = true }

# math
nalgebra = { features = ["bytemuck"], workspace = true }

# other
log = { workspace = true }
web-time = { workspace = true }

# NOTE: the `cfg` expression below must stay in sync with the `web` alias
# defined in build.rs (`all(target_arch = "wasm32", target_os = "unknown")`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# wgpu's types are `!Send + !Sync` on wasm, but bevy_ecs requires both of every
# Component and Resource. bevy has `insert_non_send_resource` but no non-Send
# *component* storage, and `Window`/`RenderItem` are components — so this is not
# avoidable by moving things around. Sound here: single-threaded, no atomics.
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
# Without bevy_platform's `web` feature, its `cfg::web` is off, so
# `TaskPool::spawn` takes the std branch and never polls a task again after its
# first Pending (spawn_task would stall forever), and `bevy_platform::time::
# Instant` resolves to `std::time::Instant`, which panics on wasm. This is a
# feature-unification lever: bevy_tasks depends on bevy_platform, and enabling
# the feature here turns it on there.
bevy_platform = { version = "0.18.1", features = ["web"] }

[build-dependencies]
cfg_aliases = { workspace = true }

[dev-dependencies]
# Widget implementations are only needed by tests/examples. A dev-dependency
# keeps the one-way crate rule (matcha-ecs-widgets -> matcha-ecs) intact.
#
# Tests *of* a widget live in that crate's own tests/ directory. What is left
# here uses widgets only as material for building a tree to exercise a core
# contract against — focus, picking, clipping, reconcile. Real widgets rather
# than synthetic ones on purpose: they keep those tests readable as usage.
matcha-ecs-widgets = { workspace = true }
# Headless windows/event-loop for tests/headless_app.rs. `headless` is an
# additive feature (rides on the winit backend), so unifying it into test
# builds leaves the winit path unchanged; normal builds never see it.
matcha-window = { workspace = true, features = ["headless"] }
# Examples call env_logger::init() so RUST_LOG surfaces wgpu validation errors,
# which otherwise go through the `log` facade silently with no backend installed.
env_logger = "^0.11.8"

[features]
default = ["winit"]
winit = ["matcha-window/winit"]
baseview = ["matcha-window/baseview"]

[lints]
workspace = true
