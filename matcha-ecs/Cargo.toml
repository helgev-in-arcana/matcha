[package]
name = "matcha-ecs"
version = { workspace = true }
edition = "2024"
publish = false

[dependencies]
# self
renderer = { workspace = true }
utils = { workspace = true }
gpu-utils = { workspace = true }
shared-buffer = { workspace = true }
matcha-window = { workspace = true }

# ecs
bevy_ecs = "0.18.1"

# async runtime, utility
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }

# graphics
wgpu = { workspace = true }
bytemuck = { features = ["derive"], workspace = true }
vello = { workspace = true }

# math
nalgebra = { features = ["bytemuck"], workspace = true }

# image
image = { workspace = true }

# other
bitflags = { workspace = true }
num = { workspace = true }
fxhash = { workspace = true }
dashmap = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
enum-map = "2.7.3"

[features]
default = ["winit"]
winit = ["matcha-window/winit"]
baseview = ["matcha-window/baseview"]

[lints]
workspace = true
