<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>matcha</title>
    <style>
      /* The canvas *is* the page. CSS owns its size; the program never calls
         request_inner_size, because on the web that sets the canvas's CSS size
         and would fight these rules. winit's ResizeObserver reports whatever
         CSS settles on back to the app as a Resized event in physical pixels. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }
      #matcha-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        /* Suppress the browser's own touch gestures so the app can handle
           pointer input itself. */
        touch-action: none;
        outline: none;
      }
      /* Replaced by the first rendered frame. Also the only thing a visitor
         sees if WebGPU is unavailable, so it says so. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, sans-serif;
        color: #c8c8d0;
        text-align: center;
        padding: 2rem;
      }
    </style>
  </head>
  <body>
    <canvas id="matcha-canvas" tabindex="0"></canvas>
    <div id="boot">Loading…</div>
    <script type="module">
      // WebGPU only. The renderer is built on storage buffers and a compute
      // pipeline, neither of which WebGL2 has, so there is no fallback to offer
      // — better to say so than to show a black rectangle.
      if (!navigator.gpu) {
        document.getElementById("boot").innerHTML =
          "This page needs <b>WebGPU</b>, which this browser does not expose.<br>" +
          "Try a recent Chrome, Edge, Firefox or Safari.";
      } else {
        // Hide the boot message once the canvas has had a chance to draw.
        const boot = document.getElementById("boot");
        const hide = () => boot.remove();
        requestAnimationFrame(() => requestAnimationFrame(hide));
      }
    </script>
  </body>
</html>
